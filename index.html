const b = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const msg = (t,c) => { const m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(c||''); };
async function derive(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b(P.salt), iterations:P.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
function boot(html){ document.open(); document.write(html); document.close(); }
async function open_(key, remember){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(P.nonce)}, key, b(P.ct));
  if(remember){
    const raw = await crypto.subtle.exportKey('raw', key);
    localStorage.setItem('bp_key', btoa(String.fromCharCode(...new Uint8Array(raw))));
  }
  boot(new TextDecoder().decode(pt));
}
document.getElementById('f').onsubmit = async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('go'); btn.disabled=true;
  msg('A\u00e7\u0131l\u0131yor, birka\u00e7 saniye s\u00fcrebilir\u2026','wait');
  try{
    const key = await derive(document.getElementById('pw').value.trim());
    await open_(key, document.getElementById('rem').checked);
  }catch(e){
    msg('\u015eifre yanl\u0131\u015f, tekrar deneyin.','err'); btn.disabled=false;
  }
};
(async ()=>{
  const k = localStorage.getItem('bp_key');
  if(!k) return;
  try{
    const key = await crypto.subtle.importKey('raw', b(k), {name:'AES-GCM'}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(P.nonce)}, key, b(P.ct));
    boot(new TextDecoder().decode(pt));
  }catch(e){ localStorage.removeItem('bp_key'); }
})();
</script>
